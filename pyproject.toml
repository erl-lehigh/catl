[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CaTL"                    # This becomes the pip name
version = "1.0.0"
description = "Capability Temporal Logic Tool"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Crockett Hensley", email = "crh325@lehigh.edu"}, {name = "Cristian-Ioan Vasile", email = "crv519@lehigh.edu"}]
requires-python = ">=3.6"
dependencies = [
    "pytelo>=1.0.0",
    "networkx>=3.0"
]


[project.urls]
"Homepage" = "https://github.com/erl-lehigh/catl"
"Repository" = "https://github.com/erl-lehigh/catl"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]